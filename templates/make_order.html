{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-4">
            <div class="card my-2">
                <div class="card-header bg-dark text-white">
                    <h3 class="mb-3">{{title}}</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                            {{ form.as_div}}

                        <div class="d-grid gap-2 my-2">
                            <button type="submit" class="btn btn-warning">{{submit_text}}</button>
                        </div> 
                    </form>
                </div>
                
                {% if not user.is_authenticated and action != 'update' %}
                <div class="card-footer text-muted">
                    <p class="my-2">Если вы хотите отслеживать свои записи, <a href="{% url 'register' %}">зарегистрируйтесь</a> или <a href="{% url 'login' %}">войдите</a> в систему.</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
