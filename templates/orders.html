{% extends "base.html" %}
{% block title %}
    {{title}}
{% endblock title %}


{% block content %}
<div class="container row bg-dark p-3 rounded-3">
    <form>
        <div class="input-group mb-3">              
            <input type="text" class="form-control" id="searchForm" aria-describedby="searchForm" placeholder="Введите запрос" name=q value="{{ request.GET.q|default:'' }}">
            <button type="submit" class="btn btn-dark border-warning">
                <span>
                    <i class="bi bi-search"></i>
                </span>
            </button>  
        </div>
        <div class="col d-flex">  
            <div class="row mb-3">    
                <label class="form-label">Искать по:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="searchByPhone" name="search_by_phone" value="true" {% if request.GET.search_by_phone %} checked {% endif %}>        
                    <label class="form-check-label" for="searchByPhone">Телефону</label>    
                </div>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="checkbox" id="searchByName" name="search_by_name" value="true" {% if request.GET.search_by_name %}checked{% endif%}>        
                    <label class="form-check-label" for="searchByName">Имени</label>    
                </div>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="checkbox" id="searchByComment" name="search_by_comment" value="true" {% if request.GET.search_by_comment %}checked{% endif%}>        
                    <label class="form-check-label" for="searchByComment">Комментарию</label>    
                </div>
            </div>
            <div class="row mb-3">    
                <label class="form-label">Сортировать по дате:</label>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="radio" name="order_by_date" id="orderByDesc" value="desc" {% if request.GET.order_by_date == 'desc' or not request.GET.order_by_date %}checked{% endif%}>        
                    <label class="form-check-label" for="orderByDesc">По убыванию</label>    
                </div>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="radio" name="order_by_date" id="orderByAsc" value="asc"
                    {% if request.GET.order_by_date == 'asc' %}checked{% endif%}>        
                    <label class="form-check-label" for="orderByAsc">По возрастанию</label>    
                </div>
            </div>
            <div class="row mb-3">    
                <label class="form-label">Статус заявки:</label>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="checkbox" id="statusNotApproved" name="status_not_approved" value="true" {% if request.GET.status_not_approved %}checked{% endif%}>        
                    <label class="form-check-label" for="statusNotApproved">Новая</label>    
                </div>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="checkbox" id="statusApproved" name="status_approved" value="true" {% if request.GET.status_approved %}checked{% endif%}>        
                    <label class="form-check-label" for="statusApproved">Подтвержденная</label>    
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="statusInProgress" name="status_in_progress" value="true" {% if request.GET.status_in_progress %}checked{% endif%}>
                    <label class="form-check-label" for="statusInProgress">В работе</label>
                </div>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="checkbox" id="statusDone" name="status_done" value="true" {% if request.GET.status_done %}checked{% endif%}>        
                    <label class="form-check-label" for="statusDone">Выполненная</label>    
                </div>    
                <div class="form-check form-check-inline">        
                    <input class="form-check-input" type="checkbox" id="statusCanceled" name="status_canceled" value="true" {% if request.GET.status_canceled %}checked{% endif%}>        
                    <label class="form-check-label" for="statusCanceled">Отмененная</label>    
                </div>
            </div>
        </div>  
    </form>
</div>
    {% for order in orders %}
        {% include "order_detail_partial.html" %}
    {% endfor %}
    <a href="/">Назад</a>
{% endblock content %}
{% block footer %}
    {% include "footer.html" %}
{% endblock footer %}
