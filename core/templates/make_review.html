{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container">
    <div class="col-12 col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">
                <h4>Оставьте свой отзыв</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_div }}
                    <button type="submit" class="btn btn-dark mt-5">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
