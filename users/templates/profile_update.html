{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-3">
            <div class="card">
                <div class="card-header">
                    <h2>Обновление профиля</h2>
                </div>
                <div class="card-body form-continer align-items-start">

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p}}
                        <button type="submit" class="btn btn-success">Обновить профиль</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
